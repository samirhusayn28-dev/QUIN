name: tally_counter
description: "QUIN — Neo-brutalist tally counter. Android first, iOS second."
publish_to: 'none'
version: 1.0.0+20001

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  home_widget: ^0.10.0
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  archive: ^4.5.2
  encrypt: ^5.0.3
  crypto: ^3.0.7
  pointycastle: ^3.9.1
  uuid: ^4.6.0
  path_provider: ^2.1.4
  intl: ^0.20.2
  sqlite3_flutter_libs: ^0.6.0+eol
  wakelock_plus: ^1.8.1
  syncfusion_flutter_charts: ^35.1.40+1
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.10
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  # Android adaptive icon: full-bleed background, artwork-only foreground (so
  # the launcher shape is never ringed by white), plus a monochrome layer for
  # themed icons. Legacy mipmaps keep the full original image as a fallback.
  adaptive_icon_background: assets/icon/ic_background.png
  adaptive_icon_foreground: assets/icon/ic_foreground.png
  adaptive_icon_monochrome: assets/icon/ic_monochrome.png

flutter:
  uses-material-design: true
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 700
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack-Regular.ttf
